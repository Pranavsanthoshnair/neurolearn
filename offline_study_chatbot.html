
<h2 class="sr-only">StudyBot — an AI-powered offline study chatbot for asking questions, getting explanations, and generating quizzes</h2>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #5046e4;
    --accent-soft: #eeecfd;
    --accent-text: #3730b8;
    --bot-bg: var(--color-background-secondary);
    --user-bg: #5046e4;
    --user-text: #ffffff;
    --font-display: 'DM Serif Display', serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --radius: 16px;
    --radius-sm: 8px;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 620px;
    font-family: var(--font-body);
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius);
    overflow: hidden;
  }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
    flex-shrink: 0;
  }

  #header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #logo {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    color: #fff;
    font-size: 16px;
    font-style: italic;
  }

  #header-title {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--color-text-primary);
    font-style: italic;
  }

  #header-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    font-weight: 400;
  }

  #mode-bar {
    display: flex;
    gap: 6px;
    padding: 10px 20px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .mode-btn {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    color: var(--color-text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .mode-btn:hover { background: var(--color-background-tertiary); }

  .mode-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
  }

  .avatar.bot {
    background: var(--accent-soft);
    color: var(--accent-text);
    font-family: var(--font-display);
    font-style: italic;
  }

  .avatar.user {
    background: var(--accent);
    color: #fff;
  }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    line-height: 1.6;
    color: var(--color-text-primary);
    background: var(--bot-bg);
    border: 0.5px solid var(--color-border-tertiary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-color: transparent;
  }

  .bubble code {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--color-background-tertiary);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--color-text-primary);
  }

  .bubble strong { font-weight: 500; }

  .typing-dot {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing-dot span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--color-text-secondary);
    animation: bounce 1.2s infinite;
  }

  .typing-dot span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  #suggestions {
    padding: 0 20px 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .suggestion-chip {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-body);
  }

  .suggestion-chip:hover {
    background: var(--accent-soft);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  #input-area {
    padding: 12px 16px;
    border-top: 0.5px solid var(--color-border-tertiary);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--color-background-primary);
    flex-shrink: 0;
  }

  #input-wrap {
    flex: 1;
    position: relative;
  }

  #user-input {
    width: 100%;
    min-height: 40px;
    max-height: 100px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    font-family: var(--font-body);
    font-size: 14px;
    resize: none;
    outline: none;
    line-height: 1.5;
    transition: border 0.15s;
  }

  #user-input:focus { border-color: var(--accent); }

  #send-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  #send-btn:hover { opacity: 0.85; }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  #send-btn svg { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #subject-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  #clear-btn {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--color-text-secondary);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s;
  }

  #clear-btn:hover { color: var(--color-text-primary); }
</style>

<div id="app">
  <div id="header">
    <div id="header-left">
      <div id="logo">S</div>
      <div>
        <div id="header-title">StudyBot</div>
        <div id="header-sub">Your personal study assistant</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="subject-tag">General</span>
      <button id="clear-btn">Clear</button>
    </div>
  </div>

  <div id="mode-bar">
    <button class="mode-btn active" data-mode="explain">Explain</button>
    <button class="mode-btn" data-mode="quiz">Quiz Me</button>
    <button class="mode-btn" data-mode="summarise">Summarise</button>
    <button class="mode-btn" data-mode="formula">Formulas</button>
    <button class="mode-btn" data-mode="flashcard">Flashcards</button>
    <button class="mode-btn" data-mode="example">Examples</button>
  </div>

  <div id="messages"></div>

  <div id="suggestions"></div>

  <div id="input-area">
    <textarea id="user-input" placeholder="Ask anything to study..." rows="1"></textarea>
    <button id="send-btn" id="send-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
const MODES = {
  explain: { label: 'Explain', system: 'You are a patient, clear study tutor. Explain concepts in a structured way using bullet points, examples, and analogies. Use **bold** for key terms. Keep responses educational and engaging.' },
  quiz: { label: 'Quiz Me', system: 'You are a quiz master for students. Generate 3 multiple-choice or short-answer questions on the topic. Number them clearly. After the student answers, evaluate their responses and explain correct answers.' },
  summarise: { label: 'Summarise', system: 'You are a study assistant. Create concise, structured summaries with key points in bullet form. Highlight the most important concepts. Use **bold** for key terms.' },
  formula: { label: 'Formulas', system: 'You are a subject tutor focusing on formulas, equations, and rules. Present formulas clearly, explain each variable, give a worked example, and note common mistakes.' },
  flashcard: { label: 'Flashcards', system: 'You are a flashcard generator. Given a topic, produce 5 flashcards in the format:\n**Q:** [question]\n**A:** [answer]\nKeep answers concise but complete.' },
  example: { label: 'Examples', system: 'You are a study tutor who teaches through examples. For any concept, provide 3 clear, real-world examples that build from simple to complex. Explain why each example illustrates the concept.' }
};

const SUGGESTIONS = {
  explain: ['Explain photosynthesis', 'How does gravity work?', 'What is machine learning?', 'Explain the water cycle'],
  quiz: ['Quiz me on WW2', 'Quiz me on algebra', 'Quiz me on the periodic table', 'Quiz me on Shakespeare'],
  summarise: ['Summarise the French Revolution', 'Summarise Newton\'s laws', 'Summarise DNA replication'],
  formula: ['Quadratic formula', 'Laws of thermodynamics', 'Ohm\'s law', 'Kinematic equations'],
  flashcard: ['Flashcards: Mitosis', 'Flashcards: Python basics', 'Flashcards: Roman Empire'],
  example: ['Examples of osmosis', 'Examples of figurative language', 'Examples of recursion']
};

let currentMode = 'explain';
let history = [];
let isLoading = false;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const suggestionsEl = document.getElementById('suggestions');
const subjectTag = document.getElementById('subject-tag');
const clearBtn = document.getElementById('clear-btn');

function renderSuggestions() {
  suggestionsEl.innerHTML = '';
  (SUGGESTIONS[currentMode] || []).forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'suggestion-chip';
    chip.textContent = s;
    chip.onclick = () => { inputEl.value = s; send(); };
    suggestionsEl.appendChild(chip);
  });
}

function addMessage(role, text, isTyping = false) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'bot' ? 'S' : 'U';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (isTyping) {
    bubble.innerHTML = '<div class="typing-dot"><span></span><span></span><span></span></div>';
  } else {
    bubble.innerHTML = formatText(text);
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function detectSubject(text) {
  const t = text.toLowerCase();
  if (/math|algebra|calculus|equation|formula|geometry|trigon/.test(t)) return 'Maths';
  if (/biology|cell|dna|organism|evolution|photosyn/.test(t)) return 'Biology';
  if (/chemistry|atom|molecule|periodic|reaction|bond/.test(t)) return 'Chemistry';
  if (/physics|force|energy|motion|gravity|wave/.test(t)) return 'Physics';
  if (/history|war|revolution|empire|century|ancient/.test(t)) return 'History';
  if (/python|code|programming|algorithm|javascript|function/.test(t)) return 'Coding';
  if (/english|literature|poem|grammar|metaphor|shakespeare/.test(t)) return 'English';
  if (/geography|climate|country|map|continent|capital/.test(t)) return 'Geography';
  return 'General';
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  isLoading = true;
  sendBtn.disabled = true;
  suggestionsEl.style.display = 'none';

  const subject = detectSubject(text);
  subjectTag.textContent = subject;

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  const typingBubble = addMessage('bot', '', true);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: MODES[currentMode].system,
        messages: history
      })
    });

    const data = await res.json();
    const reply = data.content?.map(b => b.text || '').join('') || 'Sorry, I could not get a response.';

    typingBubble.innerHTML = formatText(reply);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    history.push({ role: 'assistant', content: reply });
  } catch (err) {
    typingBubble.innerHTML = formatText('**Error:** Could not connect. Please check your connection and try again.');
  }

  isLoading = false;
  sendBtn.disabled = false;
  suggestionsEl.style.display = 'flex';
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    renderSuggestions();
  });
});

sendBtn.addEventListener('click', send);

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

clearBtn.addEventListener('click', () => {
  history = [];
  messagesEl.innerHTML = '';
  subjectTag.textContent = 'General';
  addMessage('bot', '**Welcome to StudyBot!** 👋\n\nI\'m here to help you study smarter. Choose a mode above:\n\n• **Explain** — get clear concept explanations\n• **Quiz Me** — test your knowledge\n• **Summarise** — get quick summaries\n• **Formulas** — explore equations and rules\n• **Flashcards** — generate revision cards\n• **Examples** — learn through examples\n\nWhat would you like to study today?');
});

renderSuggestions();
addMessage('bot', '**Welcome to StudyBot!** 👋\n\nI\'m here to help you study smarter. Choose a mode above:\n\n• **Explain** — get clear concept explanations\n• **Quiz Me** — test your knowledge\n• **Summarise** — get quick summaries\n• **Formulas** — explore equations and rules\n• **Flashcards** — generate revision cards\n• **Examples** — learn through examples\n\nWhat would you like to study today?');
</script>
